# Docker's embedded DNS follows service recreation without baking container IPs into nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream gateway {
    zone gateway 64k;
    server api-gateway:8080 resolve;
}
upstream orders {
    zone orders 64k;
    server order-service:8084 resolve;
}
upstream inventory {
    zone inventory 64k;
    server inventory-service:8081 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    # Never automatically replay a purchase through a different upstream.
    proxy_next_upstream off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/orders {
        limit_except POST { deny all; }
        proxy_pass http://gateway/orders;
    }
    location = /api/orders/activity {
        limit_except GET { deny all; }
        proxy_pass http://orders/orders/activity;
    }
    location /api/events/ {
        limit_except GET { deny all; }
        proxy_pass http://inventory/events/;
    }
    location /api/ { return 404; }
    location /actuator { return 404; }
    location / {
        try_files $uri $uri/ =404;
    }
}
