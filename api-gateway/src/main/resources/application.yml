server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${GATEWAY_KAFKA_MAX_BLOCK_MS:3000}
        request.timeout.ms: ${GATEWAY_KAFKA_REQUEST_TIMEOUT_MS:2000}
        delivery.timeout.ms: ${GATEWAY_KAFKA_DELIVERY_TIMEOUT_MS:5000}

gateway:
  send-timeout-ms: ${GATEWAY_SEND_TIMEOUT_MS:6000}

management:
  endpoint:
    health:
      probes:
        enabled: true
