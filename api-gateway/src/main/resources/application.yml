server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Timeouts courts: un Kafka en panne doit donner un 503 rapide, pas une requete pendue.
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:2000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:5000}

gateway:
  publish-timeout-ms: ${GATEWAY_PUBLISH_TIMEOUT_MS:5000}
