{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.app.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $.Values.app.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- if $svc.waitFor }}
      # Services fail fast at startup when Postgres or Redis is not reachable yet, which would crash-loop the pod on a
      # cold start. pg_isready needs -U because the pod uid has no passwd entry.
      initContainers:
        {{- range $dependency := $svc.waitFor }}
        - name: wait-for-{{ $dependency }}
          {{- if eq $dependency "postgres" }}
          image: {{ $.Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U postgres -d postgres; do sleep 2; done"]
          {{- else if eq $dependency "redis" }}
          image: {{ $.Values.redis.image }}
          command: ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do sleep 2; done"]
          {{- else }}
          {{- fail (printf "unknown waitFor dependency %q" $dependency) }}
          {{- end }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $.Values.image.repository }}/{{ $name }}:{{ default $.Values.image.tag $svc.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ $.Values.app.javaOpts | quote }}
            {{- if $svc.kafka }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "ticketrush.kafkaBootstrap" $ | quote }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $secretKey := $svc.secretEnv }}
            {{- include "ticketrush.secretEnv" (dict "name" $key "key" $secretKey "root" $) | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $.Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
