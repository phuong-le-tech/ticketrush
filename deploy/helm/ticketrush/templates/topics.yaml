{{- range .Values.topics.names }}
{{- /* Each source topic plus its dead-letter topic <name>.DLT (M4). A Kubernetes name must be
       lowercase, so metadata.name lowercases ".DLT"; spec.topicName keeps the real topic name. */}}
{{- range (list . (printf "%s.DLT" .)) }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ lower . }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  topicName: {{ . }}
  partitions: {{ $.Values.topics.partitions }}
  replicas: {{ $.Values.kafka.replicationFactor }}
{{- end }}
{{- end }}
