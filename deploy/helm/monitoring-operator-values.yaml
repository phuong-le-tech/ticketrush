# Install only the operator and CRDs. TicketRush owns its small Prometheus/Grafana workloads.
# Source: prometheus-community/kube-prometheus-stack 92.16.1.
defaultRules:
  create: false
alertmanager:
  enabled: false
grafana:
  enabled: false
prometheus:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
kubernetesServiceMonitors:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  # Disabling admission hooks also removes the generated TLS Secret.
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 250m, memory: 192Mi}
