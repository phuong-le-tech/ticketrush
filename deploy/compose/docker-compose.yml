# Local infra for TicketRush M1: Kafka (KRaft, 1 broker), Postgres, Redis.
# Credentials come from the environment with local dummy defaults (see .env.example).
name: ticketrush
services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in orders.requested tickets.reserved orders.rejected payments.result orders.confirmed tickets.released; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions 12 --replication-factor 1
        done

  postgres:
    image: postgres:18.6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketrush-local}
      POSTGRES_DB: ticketrush
    volumes:
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ticketrush"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.2
    # Waits for topic creation so `docker compose up --wait` only returns once the stack is fully
    # provisioned (a one-shot init container alone would count as ready while still running).
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- application services (built from the repo root with each module Dockerfile) ----
  # Inside the compose network Kafka is reached on the INTERNAL listener (kafka:19092).

  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  inventory-service:
    build:
      context: ../..
      dockerfile: inventory-service/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INVENTORY_SEED_EVENT_ID: ${INVENTORY_SEED_EVENT_ID:-concert-1}
      INVENTORY_SEED_STOCK: ${INVENTORY_SEED_STOCK:-1000}
      INVENTORY_SEED_PRICE_CENTS: ${INVENTORY_SEED_PRICE_CENTS:-5000}
      INVENTORY_SEED_CURRENCY: ${INVENTORY_SEED_CURRENCY:-EUR}
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-300}

  fake-payment-provider:
    build:
      context: ../..
      dockerfile: fake-payment-provider/Dockerfile

  payment-service:
    build:
      context: ../..
      dockerfile: payment-service/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      fake-payment-provider:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PAYMENT_PROVIDER_URL: http://fake-payment-provider:8083
      PAYMENT_PROVIDER_TIMEOUT_MS: ${PAYMENT_PROVIDER_TIMEOUT_MS:-2000}

  order-service:
    build:
      context: ../..
      dockerfile: order-service/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/ticketrush
      ORDER_DB_USER: ${POSTGRES_USER:-ticketrush}
      ORDER_DB_PASSWORD: ${POSTGRES_PASSWORD:-ticketrush-local}

  notification-service:
    build:
      context: ../..
      dockerfile: notification-service/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
