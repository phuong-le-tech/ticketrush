server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: payment-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    listener:
      ack-mode: manual

payment:
  provider:
    url: ${PAYMENT_PROVIDER_URL:http://localhost:8083}
    timeout-ms: ${PAYMENT_PROVIDER_TIMEOUT_MS:2000}

ticketrush:
  kafka:
    retry:
      initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:4}

management:
  endpoint:
    health:
      probes:
        enabled: true
