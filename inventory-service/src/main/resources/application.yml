server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: inventory-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

inventory:
  seed:
    event-id: ${INVENTORY_SEED_EVENT_ID:concert-1}
    stock: ${INVENTORY_SEED_STOCK:1000}
    price-cents: ${INVENTORY_SEED_PRICE_CENTS:5000}
    currency: ${INVENTORY_SEED_CURRENCY:EUR}
  reservation-ttl-seconds: ${RESERVATION_TTL_SECONDS:300}
  # How long an order's reservation outcome is remembered for dedupe (default 7 days).
  dedup-ttl-seconds: ${INVENTORY_DEDUP_TTL_SECONDS:604800}

ticketrush:
  kafka:
    retry:
      initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:4}

management:
  endpoint:
    health:
      probes:
        enabled: true
